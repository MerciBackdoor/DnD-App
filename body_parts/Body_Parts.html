<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Анатомия Попаданий (к12)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="body_parts_styles.css">
</head>
<body>

  <div class="app-container">
    
    <div class="diagram-panel">
      <svg viewBox="0 0 320 420" id="body-svg">
        <circle cx="160" cy="210" r="150" class="vitruvian-ring" />
        <circle cx="160" cy="210" r="195" class="vitruvian-ring dashed" />
        <line x1="160" y1="10" x2="160" y2="410" class="vitruvian-axis" />
        <line x1="10" y1="210" x2="310" y2="210" class="vitruvian-axis" />
        
        <path id="part-1" class="body-part" d="M 160,25 C 175,25 185,35 185,50 C 185,67 173,75 160,75 C 147,75 135,67 135,50 C 135,35 145,25 160,25 Z" />
        
        <path id="part-2" class="body-part" d="M 148,74 L 172,74 L 205,90 L 195,130 L 125,130 L 115,90 Z" />
        
        <path id="part-3" class="body-part" d="M 125,130 L 195,130 L 185,185 L 135,185 Z" />
        
        <path id="part-12" class="body-part" d="M 135,185 L 185,185 L 160,215 Z" />
        
        <path id="part-4" class="body-part" d="M 115,90 L 125,130 L 95,165 L 80,135 Z" />
        <path id="part-5" class="body-part" d="M 80,135 L 95,165 L 65,215 L 45,195 Z" />
        
        <path id="part-6" class="body-part" d="M 205,90 L 240,135 L 225,165 L 195,130 Z" />
        <path id="part-7" class="body-part" d="M 240,135 L 275,195 L 255,215 L 225,165 Z" />
        
        <path id="part-8" class="body-part" d="M 135,185 L 160,215 L 145,300 L 115,285 Z" />
        <path id="part-9" class="body-part" d="M 115,285 L 145,300 L 130,390 L 100,395 Z" />
        
        <path id="part-10" class="body-part" d="M 185,185 L 205,285 L 175,300 L 160,215 Z" />
        <path id="part-11" class="body-part" d="M 175,300 L 205,285 L 220,395 L 190,390 Z" />
      </svg>
    </div>
    
    <div class="control-panel">
      <div class="dice-box">
        <div id="d12-cube" class="d12-mesh">?</div>
        <div id="target-display" class="hit-title">Цель</div>
      </div>
      
      <button id="hit-trigger" onclick="rollHitLocation()">⚔️ ПОПАДАНИЕ</button>
      
      <div class="log-box">
        <div class="log-header">Лог попаданий</div>
        <div id="combat-log" class="log-content">
          <div class="log-empty">Тишина на поле боя...</div>
        </div>
      </div>
    </div>

  </div>

  <script src="body_parts_scripts.js"></script>
</body>
</html>
