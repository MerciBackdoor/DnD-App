<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Время и погода</title>
    <link rel="stylesheet" href="clock_weather_styles.css">
</head>
<body>

<div class="cw-layout">

    <!-- ЛЕВАЯ ПОЛОВИНА: часы кампании -->
    <section class="cw-pane clock-pane">
        <div class="campaign-container">
            <header class="calendar-header">
                <h1>День <span id="day-display">1</span></h1>
                <p id="phase-display" class="phase-text">Рассвет</p>
            </header>

            <div class="clock-frame">
                <div id="sky-backboard" class="sky-bg phase-dawn">
                    <div class="stars-overlay"></div>

                    <div id="celestial-disc" class="celestial-disc">
                        <div class="sun">☀️</div>
                        <div class="moon">🌙</div>
                    </div>

                    <div class="horizon-mask"></div>
                </div>
            </div>

            <div class="digital-time">
                <span id="time-display">06:00</span>
            </div>

            <div class="control-panel">
                <div class="control-group">
                    <button onclick="changeTime(-60)">-1 ч</button>
                    <button onclick="changeTime(-30)">-30 мин</button>
                    <button onclick="changeTime(30)">+30 мин</button>
                    <button onclick="changeTime(60)">+1 ч</button>
                </div>
                <div class="control-group rests">
                    <button class="btn-rest" onclick="changeTime(60)">Короткий отдых (+1 ч)</button>
                    <button class="btn-rest long-rest" onclick="changeTime(480)">Продолжительный отдых (+8 ч)</button>
                </div>
                <div class="control-group days">
                    <button onclick="changeDay(-1)">Предыдущий день</button>
                    <button onclick="changeDay(1)">Следующий день</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ПРАВАЯ ПОЛОВИНА: погода -->
    <section class="cw-pane weather-pane">
        <div class="weather-panel">

            <div class="section">

                <div class="field">
                    <label>Погода</label>

                    <select id="weatherSelect">
                        <option value="clear">Ясно</option>
                        <option value="rain">Сильный дождь</option>
                        <option value="snow">Снегопад</option>
                        <option value="fog">Туман</option>
                        <option value="storm">Шторм</option>
                        <option value="wind">Сильный ветер</option>
                    </select>
                </div>

                <div class="field">
                    <label>Температура</label>

                    <div class="temp-row">
                        <input type="range" min="-40" max="50" value="18" id="tempSlider">
                        <span id="tempValue">18°C</span>
                    </div>
                </div>

            </div>

            <div class="result">

                <div class="weather-top">
                    <div class="weather-icon" id="weatherIcon">☀</div>

                    <div>
                        <div class="weather-title" id="weatherTitle">Ясно</div>
                        <div class="weather-temp" id="weatherTemp">18°C</div>
                    </div>
                </div>

                <div class="effect-box">
                    <div class="effect-title">Эффекты</div>
                    <div class="effect-text" id="effectText">
                        Спокойная погода без негативных эффектов.
                    </div>
                </div>

            </div>

        </div>
    </section>

</div>

<script src="clock_scripts.js"></script>
<script src="weather_scripts.js"></script>
</body>
</html>
